[package]
name = "almastudio"
version = "1.1.1"
description = "AlmaStudio — multi-project desktop workspace for AI coding agents"
authors = ["Almaware"]
license = "MIT"
repository = "https://github.com/almaware/almastudio"
edition = "2021"
rust-version = "1.82"

[lib]
name = "almastudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gates the multi-webview API, which is how a browser tab gets a
# real webview rather than an iframe that most sites refuse to load.
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PTY-backed terminals (claude / codex / shell)
portable-pty = "0.9"

# Local git operations only — no network features, keeps the build lean and
# avoids pulling openssl/libssh2 on Linux.
git2 = { version = "0.21", default-features = false }

# Filesystem watching + gitignore-aware directory listing
notify = "8"
ignore = "0.4"

base64 = "0.22"
# Already in the tree via tauri; named explicitly because browser tabs parse
# and normalise user-typed addresses.
url = "2"
parking_lot = "0.12"

# Text search in the right panel: the pattern, and VS Code-style include and
# exclude globs. Both are already in the tree through `ignore`.
regex = "1"
globset = "0.4"

# The connection token for the VS Code server started from the new-tab menu.
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

# Deleting a file sends it to the OS trash rather than unlinking it. A tool
# that can delete a user's source files should never do so irreversibly.
trash = "5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Ending the VS Code server's whole process group, not just its launcher.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Release profile tuned for a small binary and low resident memory.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
