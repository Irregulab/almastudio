name: Release

# Bundles are no longer built here. scripts/release-build.sh builds and signs
# every platform on a Mac, uploads them to a draft release and pushes the tag;
# this workflow only takes that draft live — release notes from CHANGELOG.md,
# the updater manifest, publishing — in about a minute on a Linux runner.
# Building all four platforms here, macOS minutes at ten times the rate, ran
# through the organisation's Actions allowance.
#
# scripts/publish-release.sh does the work, so the same step can be run by
# hand when Actions is unavailable. See docs/UPDATES.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the leading v)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: bash scripts/publish-release.sh "$VERSION"
