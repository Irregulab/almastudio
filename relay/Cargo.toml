[package]
name = "almastudio-relay"
version = "0.1.0"
description = "Forwards encrypted AlmaStudio companion connections between phones and desktops"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.26"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
